services:
  - type: web
    name: image-editing-system
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: IMAGE_ADMIN_USERNAME
        sync: false
      - key: IMAGE_ADMIN_PASSWORD
        sync: false
      - key: IMAGE_PUBLIC_ORIGIN
        sync: false
      - key: PORT
        value: 3000
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: GOOGLE_CLOUD_LOCATION
        value: us-central1
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: ./gcp-key.json
